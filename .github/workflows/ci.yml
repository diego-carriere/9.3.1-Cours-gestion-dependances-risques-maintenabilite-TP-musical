name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Un paquet devient vulnérable, déprécié ou périmé sans qu'on touche au code : la fraîcheur
  # se revérifie chaque lundi.
  schedule:
    - cron: "0 6 * * 1"

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # La plateforme de test tire Microsoft.ApplicationInsights (voir README, « Ce qui pose question »).
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore ReveilMusical.slnx

      # TreatWarningsAsErrors=true (Directory.Build.props) : le moindre avertissement fait échouer.
      - run: dotnet build ReveilMusical.slnx --no-restore -c Release

      # Tous les tests (aucun appel réseau : transport HTTP simulé), puis le seuil de couverture.
      - run: ./scripts/coverage.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/

  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Échoue si une dépendance, directe ou transitive, porte une licence hors liste blanche.
      - run: ./licenses/audit.sh

      # Le scan versionné est celui du code actuel : un paquet ajouté sans relancer l'audit échoue.
      - run: git diff --exit-code -- licenses/licenses.json

      # Avis de licence distribués avec l'image (MIT, BSD-3-Clause) : régénérés, et à jour.
      - run: ./licenses/notices.sh
      - run: git diff --exit-code -- THIRD-PARTY-NOTICES.txt

      # Contrôle négatif permanent : le gate doit refuser un paquet GPL-3.0.
      - run: ./licenses/audit-canary.sh

      # Vulnérable, déprécié ou retard majeur : bloquant. Retard mineur : avertissement.
      - run: ./licenses/freshness.sh

  docker:
    needs: [build-test, license-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t reveil-musical:ci .
